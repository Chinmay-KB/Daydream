name: Release Daydream

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Validate the release tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check release credential state
        id: credentials
        run: |
          set -euo pipefail
          configured=0
          for value in \
            "$DEVELOPER_ID_APPLICATION" \
            "$DEVELOPER_ID_APPLICATION_P12_BASE64" \
            "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 6 ]]; then
            echo "Configure all signing and notarization secrets, or configure none." >&2
            exit 1
          fi
          if [[ "$configured" -eq 6 ]]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app
        run: ./scripts/build-app.sh "$GITHUB_REF_NAME"

      - name: Import Developer ID certificate
        if: steps.credentials.outputs.mode == 'notarized'
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/daydream.keychain-db"
          certificate_path="$RUNNER_TEMP/daydream-developer-id.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      - name: Sign app
        run: ./scripts/sign-app.sh .build/Daydream-app/Daydream.app

      - name: Prepare release directory
        run: mkdir -p release-assets

      - name: Create temporary app notarization ZIP
        if: steps.credentials.outputs.mode == 'notarized'
        run: |
          set -euo pipefail
          temporary_zip="$RUNNER_TEMP/Daydream-notarization.zip"
          ditto -c -k --keepParent .build/Daydream-app/Daydream.app "$temporary_zip"

      - name: Notarize and staple app
        if: steps.credentials.outputs.mode == 'notarized'
        run: |
          set -euo pipefail
          temporary_zip="$RUNNER_TEMP/Daydream-notarization.zip"
          ./scripts/notarize.sh "$temporary_zip" .build/Daydream-app/Daydream.app

      - name: Create final ZIP
        run: |
          set -euo pipefail
          ditto -c -k --keepParent .build/Daydream-app/Daydream.app "release-assets/Daydream-${GITHUB_REF_NAME}.zip"

      - name: Create DMG
        run: |
          set -euo pipefail
          ./scripts/create-dmg.sh .build/Daydream-app/Daydream.app "release-assets/Daydream-${GITHUB_REF_NAME}.dmg"

      - name: Sign DMG
        if: steps.credentials.outputs.mode == 'notarized'
        run: |
          set -euo pipefail
          codesign --force --sign "$DEVELOPER_ID_APPLICATION" --timestamp "release-assets/Daydream-${GITHUB_REF_NAME}.dmg"

      - name: Notarize and staple DMG
        if: steps.credentials.outputs.mode == 'notarized'
        run: |
          set -euo pipefail
          ./scripts/notarize.sh "release-assets/Daydream-${GITHUB_REF_NAME}.dmg"

      - name: Create checksums
        run: |
          set -euo pipefail
          (
            cd release-assets
            shasum -a 256 "Daydream-${GITHUB_REF_NAME}.zip" "Daydream-${GITHUB_REF_NAME}.dmg" > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.credentials.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == "notarized" ]]; then
            notes="Developer ID signed and notarized Daydream release."
          else
            notes="NON-NOTARIZED: This build is ad-hoc signed. Gatekeeper can still block it; ad-hoc signing does not bypass Gatekeeper."
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Daydream $GITHUB_REF_NAME" \
            --notes "$notes"
